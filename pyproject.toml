[project]
name = "allegiance-and-influence"
version = "0.1.0"
description = "A local multiplayer persuasion game and agent experiment test bed"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "jsonschema>=4.23,<5", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
include = ["backend/game/**/*.py", "backend/tests/**/*.py", "scripts/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
